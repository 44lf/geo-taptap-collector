[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-game-collector"
version = "0.1.0"
description = "Cross-platform GEO game Collector contracts and runtime foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "keyring>=25,<26",
  "zstandard>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
geo-game-collector = "geo_game_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_collector.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src",
  "tests/test_contracts.py",
  "tests/test_bundle_schema_v2.py",
  "tests/test_spool.py",
]
